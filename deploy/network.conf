# =============================================================================
#  PatrolSystem 开机网络配置（双 WiFi 择优 + 按网络选 IP 策略）
#  修改后执行: systemctl restart patrol-network   （或重启板子）
#
#  策略（v1.14.1）：
#    · wpa_supplicant 同时配 B410 + MLML 两个网络，按 priority 自动择优/failover
#      （优先连 priority 高且可用的；断了自动切另一个）。
#    · 连上后按“当前 SSID”决定 IP：连 STATIC_SSID(B410) 用固定 IP 192.168.3.100；
#      连其它网（如手机热点 MLML）用 DHCP 自动获取（网段不同，固定 IP 不通）。
#    · 龙芯主程序 UDP 广播自身 IP，上位机 LongLook 自动发现并连接（IP 变也能连上）。
# =============================================================================
# 无线网卡名
WIFI_IFACE=wlan0
WPA_CONF=/etc/wpa_supplicant.conf

# ---- 主 WiFi：B410（固定 IP 网络，priority 高，优先连）----
WIFI_SSID=B410
WIFI_PASSWORD=88888888
WIFI_PRIORITY=10

# ---- 次 WiFi：MLML 手机热点（DHCP，priority 低，B410 不可用时自动切）----
WIFI_SSID2=MLML
WIFI_PASSWORD2=MM111111
WIFI_PRIORITY2=5

# ---- 固定 IP：仅当“当前连的 SSID == STATIC_SSID”时启用；否则改用 DHCP ----
STATIC_SSID=B410
STATIC_IP=192.168.3.100
NETMASK=24
GATEWAY=192.168.3.1

# ---- DNS ----
DNS1=192.168.3.1
DNS2=223.5.5.5

# 连通性测试目标
PING_HOST=baidu.com

# UDP 自动发现广播端口（龙芯主程序广播自身 IP，上位机监听此端口自动发现）
DISCOVERY_PORT=8083
