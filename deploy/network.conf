# =============================================================================
#  PatrolSystem 开机网络配置（Station 模式：连接 B410 + 固定 IP）
#  修改后执行: systemctl restart patrol-network   （或重启板子）
# =============================================================================
# 无线网卡名
WIFI_IFACE=wlan0
# WiFi 名称与密码（设置后开机自动生成 /etc/wpa_supplicant.conf）
WIFI_SSID=B410
WIFI_PASSWORD=88888888
WPA_CONF=/etc/wpa_supplicant.conf

# ---- 固定 IP（Station 模式，与 B410 路由器同网段）----
# 留空则改用 DHCP 自动获取
STATIC_IP=192.168.3.100
NETMASK=24
GATEWAY=192.168.3.1

# ---- DNS ----
DNS1=192.168.3.1
DNS2=223.5.5.5

# 连通性测试目标
PING_HOST=baidu.com
