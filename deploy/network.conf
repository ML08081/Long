# PatrolSystem Wi-Fi template. Device credentials are provisioned separately.
# MLML uses DHCP: do not reuse an address, gateway or DNS from another WLAN.
WIFI_IFACE=wlan0
WPA_CONF=/etc/wpa_supplicant.conf
WIFI_SSID=MLML
WIFI_PASSWORD_FILE=/etc/patrol/wifi-password
WIFI_PRIORITY=10
WIFI_SSID2=
STATIC_SSID=
STATIC_IP=
NETMASK=24
GATEWAY=
DNS1=
DNS2=
DISCOVERY_PORT=8083
